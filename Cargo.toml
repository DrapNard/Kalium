[package]
name = "kalium"
version = "0.3.0-alpha.2"
edition = "2021"
authors = ["DrapNard", "Kalium contributors"]
license = "AGPL-3.0-only"
description = "Open-source, artist-first 3D texture painting studio"

[features]
default = []
gpu-experimental = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.20", features = ["derive"], optional = true }
anyhow = "1.0"
egui_dock = { version = "0.16", features = ["serde"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
glam = { version = "0.30", features = ["serde"] }
gltf = { version = "1.4", features = ["import"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tobj = "4.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.bundle]
name = "Kalium"
identifier = "app.vulpyr.kalium"
