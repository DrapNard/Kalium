name: Kalium Rust CI
on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  linux-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux windowing build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Check opt-in compute path
        run: cargo check --locked --all-targets --features gpu-experimental
      - name: Run unit tests
        run: cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: CLI smoke test
        run: |
          cargo run --locked -- --version
          cargo run --locked -- validate examples/Kalium-Demo.kalium
          cargo run --locked -- preview examples/Kalium-Demo.kalium ./kalium-preview.png
          cargo run --locked -- brush-inspect examples/Soft-Painter.kbrush
          cargo run --locked -- uv-mask examples/Kalium-Demo.kalium ./kalium-uv-mask.png
